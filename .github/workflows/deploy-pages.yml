name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Write site version
        run: |
          echo "{\"version\":\"${{ github.sha }}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json

      - name: Cache-bust CSS and JS in HTML
        run: |
          SHA="${{ github.sha }}"
          for file in *.html; do
            [ -f "$file" ] || continue
            sed -i \
              -e "s|href=\"css/style.css\"|href=\"css/style.css?v=${SHA}\"|g" \
              -e "s|href=\"editor/editor.css\"|href=\"editor/editor.css?v=${SHA}\"|g" \
              -e "s|src=\"js/main.js\"|src=\"js/main.js?v=${SHA}\"|g" \
              -e "s|src=\"editor/editor.js\"|src=\"editor/editor.js?v=${SHA}\"|g" \
              "$file"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
